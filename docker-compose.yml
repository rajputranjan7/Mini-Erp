version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: mini_erp
    ports:
      - "5432:5432"
    volumes:
      - erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d mini_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: "postgresql://erp_user:erp_password@postgres:5432/mini_erp?schema=public"
      JWT_SECRET: "local-dev-secret-change-me"
      JWT_EXPIRES_IN: "8h"
      CORS_ORIGIN: "http://localhost:5173"
    ports:
      - "4000:4000"

volumes:
  erp_postgres_data:
